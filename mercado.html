<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercado de Activos - Links Financial</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Links Financial</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="portafolio.html">Portafolio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="educacion.html">Educación</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contenido -->
    <div class="container py-5">
      <h2 class="text-primary text-center mb-4">Mercado de Activos</h2>

      <table class="table table-hover text-center align-middle">
        <thead class="table-primary">
          <tr>
            <th>Activo</th>
            <th>Precio Actual</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaMercado">
          <tr>
            <td>Oro</td>
            <td>$1,950</td>
            <td>
              <button class="btn btn-success btn-sm me-2">Comprar</button>
              <button class="btn btn-danger btn-sm">Vender</button>
            </td>
          </tr>
          <tr>
            <td>Plata</td>
            <td>$25</td>
            <td>
              <button class="btn btn-success btn-sm me-2">Comprar</button>
              <button class="btn btn-danger btn-sm">Vender</button>
            </td>
          </tr>
          <tr>
            <td>Acción ABC</td>
            <td>$120</td>
            <td>
              <button class="btn btn-success btn-sm me-2">Comprar</button>
              <button class="btn btn-danger btn-sm">Vender</button>
            </td>
          </tr>
          <tr>
            <td>Cripto (próximamente)</td>
            <td>—</td>
            <td><span class="text-muted">Próximamente</span></td>
          </tr>
        </tbody>
      </table>

      <div class="text-center mt-4">
        <a href="portafolio.html" class="btn btn-outline-primary"
          >Volver al Portafolio</a
        >
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <!-- Modal de Operación -->
    <div
      class="modal fade"
      id="operacionModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formOperacion">
            <div class="modal-header">
              <h5 class="modal-title" id="tituloOperacion">Operación</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body">
              <p id="detalleActivo" class="mb-3 text-muted"></p>
              <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input
                  type="number"
                  class="form-control"
                  id="cantidad"
                  min="1"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Confirmar</button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Toasts -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
      <div
        id="toastAlerta"
        class="toast align-items-center text-white bg-primary border-0"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastMensaje">Notificación</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>
  </body>
</html>
